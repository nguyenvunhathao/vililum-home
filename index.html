  <section class="section section-quote" aria-label="Trích dẫn">
    <figure class="quote">
      <blockquote class="quote-text">
        Hai mươi năm sau lúc này,<br>
        bạn sẽ thấy thất vọng<br>
        vì những điều mình không làm<br>
        hơn vì những điều mình đã làm.<br>
        <br>
        Vậy nên hãy tháo nút dây.<br>
        Hãy cho thuyền rời khỏi bến an toàn.<br>
        Hãy căng buồm đón gió.<br>
        <br>
        Tìm tòi.<br>
        Ước mơ.<br>
        Khám phá.
      </blockquote>
      <figcaption class="quote-cite">— Mark Twain</figcaption>
    </figure>
  </section>

  <section class="section section-manifesto" aria-label="Lời nhắn">
    <p class="manifesto">Hãy thắp đuốc lên mà đi</p>
