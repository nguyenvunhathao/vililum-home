    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f2efe8;
      --bg-deep: #ebe7de;
      --fg: #1f1e1d;
      --fg-secondary: #5e5d59;
      --line: rgba(31, 30, 29, 0.14);
      --frame: rgba(31, 30, 29, 0.1);
    }

    html {
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
    }

    html, body {
      min-height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Cormorant Garamond", "Times New Roman", serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.4;

      background-size: 220px;
      z-index: 0;
    }

    .section {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    .section-home {
      overflow: hidden;
    }

    .zen-field {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.55;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(2rem, 7vh, 4rem);
      padding: clamp(1.5rem, 5vh, 3.5rem) clamp(1rem, 5vw, 2.5rem);
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(0.75rem, 2vh, 1.1rem);
      text-align: center;
      width: 100%;
      max-width: 40rem;
    }

    .wordmark {
      font-size: clamp(2.25rem, 8.5vw, 6.25rem);
      font-weight: 400;
      letter-spacing: 0.34em;
      text-indent: 0.34em;
      text-transform: uppercase;
      color: var(--fg);
      line-height: 1.05;
    }

    .subtitle {
      font-size: clamp(1.2rem, 4.2vw, 2.85rem);
      font-weight: 400;
      font-style: italic;
      letter-spacing: 0.01em;
      color: var(--fg);
      line-height: 1.25;
      padding: 0 0.25rem;
    }

    .tagline {
      margin-top: 0.25rem;
      font-size: clamp(0.8rem, 2.2vw, 1.375rem);
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--fg);
      line-height: 1.45;
    }

    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(100%, 32rem);
    }

    .section-brands {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(2.5rem, 10vh, 5rem) clamp(1.5rem, 6vw, 3rem);
    }

    .brands {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: clamp(1.5rem, 5vw, 3rem);
      width: min(100%, 42rem);
    }

    .brand-link {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: clamp(3.25rem, 11vw, 5.5rem);
      height: clamp(3.25rem, 11vw, 5.5rem);
      color: var(--fg);
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .portal {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(8px, 2vw, 12px);
      background: var(--bg-deep);
      border: 1px solid var(--frame);
    }

    .portal::before {
      content: "";
      position: absolute;
      inset: clamp(6px, 2vw, 10px);
      border: 1px solid var(--line);
      pointer-events: none;
    }

    .artwork {
      display: block;
      line-height: 0;
    }

    #artwork-canvas {
      display: block;
      background: var(--bg-deep);
      touch-action: none;
    }

    .brand-link svg {
      width: 100%;
      height: 100%;
    }

    .brand-link path {
      fill: currentColor;
    }

    .brand-link:focus-visible {
      outline: 1px solid var(--fg-secondary);
      outline-offset: 4px;
    }

    .section-quote {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(2.5rem, 10vh, 5rem) clamp(1.5rem, 6vw, 3rem);
    }

    .quote {
      max-width: 38rem;
      margin: 0 auto;
      text-align: left;
    }

    .quote-text {
      font-size: clamp(1.125rem, 2.35vw, 1.375rem);
      font-weight: 400;
      line-height: 1.65;
      color: var(--fg);
      margin: 0;
    }

    .quote-cite {
      display: block;
      margin: 1.65em 0 0;
      font-size: clamp(1.125rem, 2.2vw, 1.375rem);
      font-weight: 400;
      line-height: 1.65;
      font-style: normal;
      color: var(--fg);
    }

    .section-manifesto {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(2.5rem, 10vh, 5rem) clamp(1.5rem, 6vw, 3rem);
    }

    .manifesto {
      margin: 0 auto;
      text-align: center;
      font-size: clamp(1.125rem, 2.35vw, 1.375rem);
      font-weight: 400;
      font-style: normal;
      line-height: 1.65;
      color: var(--fg);
      white-space: nowrap;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 640px) {
      .wordmark {
        letter-spacing: 0.2em;
        text-indent: 0.2em;
      }

      .tagline {
        letter-spacing: 0.07em;
      }

      .portal {
        width: auto;
      }
    }

    @media (max-width: 380px) {

    }

    @media (prefers-reduced-motion: reduce) {

        scroll-snap-type: none;
      }
